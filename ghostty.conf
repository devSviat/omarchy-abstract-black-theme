# Abstract Black — Ghostty. Hand-written so the background can carry alpha;
# see foot.ini. Hyprland does the blurring.
background = #0b0b0e
foreground = #d7dae0
background-opacity = 0.72
# Ask the compositor for blur explicitly; see the note in foot.ini.
background-blur = true
cursor-color = #ffffff
selection-background = #232833
selection-foreground = #ffffff

