# Abstract Black — foot. Hand-written rather than generated from foot.ini.tpl
# so the background can carry alpha: foot applies it to the cell background
# only, so glyphs stay fully opaque while Hyprland blurs the wallpaper behind
# the window. Colours mirror colors.toml.
#
# blur=yes is required, not decoration: a foot built with +blur speaks
# ext-background-effect-v1 to Hyprland and, with the default blur=no, tells the
# compositor NOT to blur behind it. The window is then translucent but sharp —
# decoration.blur in hyprland.lua never gets a say.
[colors-dark]
alpha=0.72
blur=yes
foreground=d7dae0
background=0b0b0b
selection-foreground=ffffff
selection-background=202329

cursor=0b0b0b ffffff

regular0=0b0b0b
regular1=e5545a
regular2=57d9a3
regular3=ecc46a
regular4=5aa2f0
regular5=a67cf0
regular6=5cd0e0
regular7=d7dae0

bright0=5a5f6b
bright1=ff757b
bright2=7ceac0
bright3=f7d68a
bright4=86bcff
bright5=c29aff
bright6=8ae0ee
bright7=ffffff
