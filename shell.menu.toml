# Full [menu] section. Clipboard and emoji pickers inherit these tokens.
# Near-opaque: this copy is the one `omarchy theme install` stages, and there
# nothing blurs behind the card (Omarchy drops a cloned theme's hyprland.lua),
# so a see-through card lets the window underneath run through the menu text.
# The full install in README.md links shell.menu.toml.example, the glass card, instead.
background                = "#0b0b0b"
background-alpha          = 0.94
text                      = "#d7dae0"
border                    = "hyprland.active-border-foreground"
border-alpha              = 0.85
scrim                     = "#050505"
scrim-alpha               = 0.1
selected-background       = "#8fb4de"
selected-background-alpha = 0.2
selected-text             = "#ffffff"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.35
